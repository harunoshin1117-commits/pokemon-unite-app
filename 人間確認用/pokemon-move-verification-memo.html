<body><main class="app">
<header><div><h1>ポケモン技 検証メモ</h1><p class="lead">項目を埋めるだけで、Codexへそのまま送れる形式に整形します。入力内容と保存記録はこの端末内に自動保存されます。</p></div><div class="badge">ローカル保存・単体HTML</div></header>
<section class="layout"><div>
<div class="card"><div class="head"><h2>検証内容を入力</h2><button class="mini" id="clearForm">入力欄をクリア</button></div><div class="body"><div class="grid">
<!-- memo-template:start -->
<div><label>ポケモン</label><input id="pokemon" placeholder="例: エースバーン"></div>
<div><label>検証対象</label><input id="move" placeholder="例: 特性「もうか」火種 Lv1〜15横断検証"></div>
<div><label>攻撃側レベル</label><input id="attackerLevel" inputmode="numeric" placeholder="例: 15"></div>
<div class="full"><label>攻撃側ステータス</label><textarea id="attackerStats" placeholder="例: 攻撃418 / 持ち物なし / メダルなし"></textarea></div>
<div class="full"><label>検証する相手ポケモン</label><textarea id="targetPokemonGroup" placeholder="例: ピカチュウ / ゲッコウガ / エースバーン"></textarea></div>
<div><label>相手レベル範囲</label><input id="targetLevelRange" placeholder="例: Lv1〜15"></div>
<div class="full"><label>相手最大HP・防御の参照元</label><textarea id="targetMaxHpAndDefenseSource" placeholder="例: pokemonData.js / show-pokemon-stats.jsで確認"></textarea></div>
<div><label>持ち物</label><input id="heldItems" placeholder="例: なし"></div>
<div><label>メダル</label><input id="emblems" placeholder="例: なし"></div>
<div class="full"><label>本体急所</label><div class="choices" id="criticalChoices"><button class="choice" data-v="なし">なし</button><button class="choice" data-v="あり">あり</button><button class="choice" data-v="不明">不明</button><button class="choice active" data-v="記録する">記録する</button><button class="choice" data-v="混在">混在</button></div><input type="hidden" id="critical" value="記録する"></div>
<div><label>発火前の火種数</label><input id="startingCinderStacks" inputmode="numeric" placeholder="例: 4"></div>
<div class="full"><label>発火させた攻撃</label><div class="choices" id="triggerActionChoices"><button class="choice active" data-v="通常攻撃">通常攻撃</button><button class="choice" data-v="強化通常攻撃">強化通常攻撃</button><button class="choice" data-v="技">技</button><button class="choice" data-v="その他">その他</button></div><input type="hidden" id="triggerAction" value="通常攻撃"></div>
<div><label>技名・攻撃名</label><input id="triggerMoveName" placeholder="例: 通常攻撃"></div>
<div class="full"><label>記録ルール</label><textarea id="recordingRule" placeholder="例: 火種追加ダメージ表示を必ず記録。自然回復が入ったらメモする。"></textarea></div>
<div class="full"><label>追加検証方針</label><textarea id="validationPlan" placeholder="どの仮説を確認するための検証かを書く"></textarea></div><div class="full level-sweep-field"><label>Lv1〜15 横断記録表</label><p class="hint">各レベルの行に、火種発火時の実測値をそのまま入力します。攻撃前HPと攻撃後HPを両方残すことで、後から自然回復が混ざったか確認しやすくします。</p><input type="hidden" id="levelSweepTable"><div class="level-sweep-scroll"><table class="level-sweep-table"><thead><tr><th>相手</th><th>Lv</th><th>最大HP</th><th>防御</th><th>攻撃前HP</th><th>本体</th><th>火種</th><th>攻撃後HP</th><th>急所</th><th>メモ</th><th>再検証</th></tr></thead><tbody>

<script>
(()=>{const FK='pkmVerify.form.v3',RK='pkmVerify.records.v1';const defs=[["pokemon", "ポケモン"], ["move", "検証対象"], ["attackerLevel", "攻撃側レベル"], ["attackerStats", "攻撃側ステータス"], ["targetPokemonGroup", "検証する相手ポケモン"], ["targetLevelRange", "相手レベル範囲"], ["targetMaxHpAndDefenseSource", "相手最大HP・防御の参照元"], ["heldItems", "持ち物"], ["emblems", "メダル"], ["critical", "本体急所"], ["startingCinderStacks", "発火前の火種数"], ["triggerAction", "発火させた攻撃"], ["triggerMoveName", "技名・攻撃名"], ["recordingRule", "記録ルール"], ["validationPlan", "追加検証方針"], ["levelSweepTable", "Lv1〜15 横断記録表"], ["calculationComparison", "後で比較する計算候補"], ["measuredDamage1", "実測ダメージ 1回目"], ["measuredDamage2", "実測ダメージ 2回目"], ["measuredDamage3", "実測ダメージ 3回目"], ["notes", "補足"]];const TEMPLATE_DEFAULTS={"pokemon":"エースバーン","move":"特性「もうか」火種 Lv1〜15横断検証","attackerLevel":"15","attackerStats":"攻撃418 / 持ち物なし / メダルなし","targetPokemonGroup":"ピカチュウ / ゲッコウガ / エースバーン","targetLevelRange":"Lv1〜15","targetMaxHpAndDefenseSource":"pokemonData.js のステータスを参照。相手ポケモンとLvごとに最大HP・防御を記録する。","heldItems":"なし","emblems":"なし","critical":"記録する","startingCinderStacks":"4","triggerAction":"通常攻撃","triggerMoveName":"通常攻撃","recordingRule":"攻撃側はエースバーンLv15で固定。相手をピカチュウ・ゲッコウガ・エースバーンの各Lv1〜15に変え、火種追加ダメージ表示を記録する。本体ダメージ・本体急所・最終HP・自然回復らしきズレも分かる範囲で記録する。","levelSweepTable":"相手ポケモン,相手Lv,最大HP,防御,攻撃前HP,本体ダメージ,本体急所,火種追加ダメージ,攻撃後HP,自然回復,メモ\nピカチュウ,1,,,,,,,,,\nピカチュウ,2,,,,,,,,,\nピカチュウ,3,,,,,,,,,\nピカチュウ,4,,,,,,,,,\nピカチュウ,5,,,,,,,,,\nピカチュウ,6,,,,,,,,,\nピカチュウ,7,,,,,,,,,\nピカチュウ,8,,,,,,,,,\nピカチュウ,9,,,,,,,,,\nピカチュウ,10,,,,,,,,,\nピカチュウ,11,,,,,,,,,\nピカチュウ,12,,,,,,,,,\nピカチュウ,13,,,,,,,,,\nピカチュウ,14,,,,,,,,,\nピカチュウ,15,,,,,,,,,\nゲッコウガ,1,,,,,,,,,\nゲッコウガ,2,,,,,,,,,\nゲッコウガ,3,,,,,,,,,\nゲッコウガ,4,,,,,,,,,\nゲッコウガ,5,,,,,,,,,\nゲッコウガ,6,,,,,,,,,\nゲッコウガ,7,,,,,,,,,\nゲッコウガ,8,,,,,,,,,\nゲッコウガ,9,,,,,,,,,\nゲッコウガ,10,,,,,,,,,\nゲッコウガ,11,,,,,,,,,\nゲッコウガ,12,,,,,,,,,\nゲッコウガ,13,,,,,,,,,\nゲッコウガ,14,,,,,,,,,\nゲッコウガ,15,,,,,,,,,\nエースバーン,1,,,,,,,,,\nエースバーン,2,,,,,,,,,\nエースバーン,3,,,,,,,,,\nエースバーン,4,,,,,,,,,\nエースバーン,5,,,,,,,,,\nエースバーン,6,,,,,,,,,\nエースバーン,7,,,,,,,,,\nエースバーン,8,,,,,,,,,\nエースバーン,9,,,,,,,,,\nエースバーン,10,,,,,,,,,\nエースバーン,11,,,,,,,,,\nエースバーン,12,,,,,,,,,\nエースバーン,13,,,,,,,,,\nエースバーン,14,,,,,,,,,\nエースバーン,15,,,,,,,,,","calculationComparison":"後で比較する候補: 1. 一括防御補正 floor((Atk部分 + HP部分 + 固定値) * 600 / (Defense + 600)) / 2. パーツ別防御補正 floor(Atk部分補正) + floor(HP部分補正) + floor(固定値補正) / 3. 防御補正前に一部floor / 4. 内部ステータス小数仮説。","measuredDamage1":"","measuredDamage2":"","measuredDamage3":"","notes":"目的: 火種追加ダメージの1ずれ原因を探す。3体それぞれLv1〜15で実測し、一括防御補正・パーツ別防御補正・その他丸め候補のどれが一致するか後で比較する。"};TEMPLATE_DEFAULTS.validationPlan="追加検証の順番: 1. 低信頼行を再測定してミスを減らす。2. ピカチュウ/ゲッコウガ/エースバーンのLv13〜15を各3回測り、同じ値が再現するか見る。3. 攻撃側エースバーンLv13〜15でも同じ相手Lv15へ発火させ、攻撃値違い説とHP係数違い説を切り分ける。4. 攻撃前HPと攻撃後HPを必ず残し、自然回復が混ざった行は再検証にする。";const SWEEP_FIELDS=['target','level','maxHp','defense','hpBefore','bodyDamage','flareDamage','hpAfter','critical','note','recheck'];const SWEEP_HEADER='相手ポケモン,相手Lv,最大HP,防御,攻撃前HP,本体ダメージ,火種追加ダメージ,攻撃後HP,本体急所,メモ,再検証';function sweepInputs(){return [...document.querySelectorAll('[data-sweep-row]')]}function csvSafe(v){return String(v??'').replace(/\r?\n/g,' ').replace(/,/g,'、').trim()}function syncSweepToHidden(){const hidden=$('levelSweepTable');if(!hidden)return;const lines=[SWEEP_HEADER];sweepInputs().forEach(row=>{lines.push(SWEEP_FIELDS.map(f=>csvSafe(row.querySelector(`[data-sweep-field="${f}"]`)?.value||'')).join(','))});hidden.value=lines.join('\n')}function renderSweepFromHidden(value=''){const lines=String(value||'').split(/\r?\n/).filter(Boolean).slice(1);const map=new Map();lines.forEach(line=>{const cells=line.split(',');if(cells.length<2)return;map.set(`${cells[0]}-${cells[1]}`,cells)});sweepInputs().forEach(row=>{const target=row.querySelector('[data-sweep-field="target"]')?.value||'';const level=row.querySelector('[data-sweep-field="level"]')?.value||'';const cells=map.get(`${target}-${level}`);if(!cells)return;SWEEP_FIELDS.forEach((field,index)=>{const input=row.querySelector(`[data-sweep-field="${field}"]`);if(input)input.value=cells[index]||''})})}const $=id=>document.getElementById(id);let records=load(RK,[]),editing=null;function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function migrate(o={}){if(o.measuredDamage&&!o.measuredDamage1)o={...o,measuredDamage1:o.measuredDamage};return o}function data(){syncSweepToHidden();let o={};defs.forEach(([id])=>o[id]=$(id).value.trim());return o}function setData(o={}){o=migrate(o);const src=Object.keys(o).length?o:TEMPLATE_DEFAULTS;defs.forEach(([id])=>$(id).value=src[id]??(id==='critical'?'??':''));renderSweepFromHidden(src.levelSweepTable||TEMPLATE_DEFAULTS.levelSweepTable||'');syncCritical();update();saveForm()}function damageSummary(o){let values=[o.measuredDamage1,o.measuredDamage2,o.measuredDamage3].filter(Boolean);if(!values.length&&o.measuredDamage)values=[o.measuredDamage];return values.length?'実測 '+values.join(' / '):'実測未入力'}function format(o,n=null){o=migrate(o);return `${n?`【検証記録 ${n}】`:'【ポケモン技 検証記録】'}\n`+defs.map(([id,l])=>`${l}: ${o[id]||''}`).join('\n')}function update(){$('preview').textContent=format(data())}function saveForm(){localStorage.setItem(FK,JSON.stringify(data()))}function msg(t,e=false){$('status').textContent=t;$('status').style.color=e?'#fca5a5':'#86efac';clearTimeout(msg.t);msg.t=setTimeout(()=>$('status').textContent='',2400)}async function copy(t){try{await navigator.clipboard.writeText(t)}catch{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}function syncCritical(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.v===$('critical').value))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function persist(){localStorage.setItem(RK,JSON.stringify(records))}function render(){$('count').textContent=records.length+'件';let box=$('savedList');box.innerHTML='';if(!records.length){box.innerHTML='<div class="empty">まだ記録はありません。</div>';return}records.slice().reverse().forEach((r,ri)=>{r=migrate(r);let i=records.length-1-ri,d=document.createElement('div');d.className='saved';d.innerHTML=`<div class="saved-title">${esc([r.pokemon,r.move].filter(Boolean).join(' / ')||'名称未入力')}</div><div class="saved-meta">${esc(damageSummary(r))}・${esc(r.savedAt||'')}</div><div class="mini-actions"><button class="mini" data-a="copy">コピー</button><button class="mini" data-a="edit">編集</button><button class="mini" data-a="dup">複製</button><button class="mini" data-a="del">削除</button></div>`;d.querySelector('[data-a=copy]').onclick=async()=>{await copy(format(r));msg('保存記録をコピーしました。')};d.querySelector('[data-a=edit]').onclick=()=>{editing=r.id;setData(r);scrollTo({top:0,behavior:'smooth'});msg('記録を読み込みました。保存すると上書きします。')};d.querySelector('[data-a=dup]').onclick=()=>{editing=null;setData({...r,measuredDamage:'',measuredDamage1:'',measuredDamage2:'',measuredDamage3:'',displayCount:'',notes:''});scrollTo({top:0,behavior:'smooth'});msg('条件を複製しました。')};d.querySelector('[data-a=del]').onclick=()=>{if(confirm('この記録を削除しますか？')){records.splice(i,1);persist();render();msg('削除しました。')}};box.appendChild(d)})}document.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',()=>{update();saveForm()}));document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{$('critical').value=b.dataset.v;syncCritical();update();saveForm()});$('applyTemplate').onclick=()=>{editing=null;setData(TEMPLATE_DEFAULTS);msg('Template loaded.')};$('copyCurrent').onclick=async()=>{await copy(format(data()));msg('現在の内容をコピーしました。')};$('saveRecord').onclick=()=>{let o=data(),now=new Date().toLocaleString('ja-JP');if(editing){let i=records.findIndex(x=>x.id===editing);if(i>=0)records[i]={...records[i],...o,savedAt:now};editing=null;msg('記録を更新しました。')}else{records.push({...o,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),savedAt:now});msg('記録を保存しました。')}persist();render()};$('duplicateForm').onclick=()=>{let o=data();editing=null;setData({...o,move:'',measuredDamage:'',measuredDamage1:'',measuredDamage2:'',measuredDamage3:'',displayCount:'',notes:''});msg('共通条件を残して新規作成しました。')};$('clearForm').onclick=()=>{if(confirm('入力欄をすべてクリアしますか？')){editing=null;setData({});msg('入力欄をクリアしました。')}};$('copyAll').onclick=async()=>{if(!records.length)return msg('記録がありません。',true);let t=['以下はポケモン技のゲーム内検証記録です。','各記録を確認し、実測値との照合、仕様判定、未確認事項の整理を行ってください。','',...records.map((r,i)=>format(r,i+1))].join('\n\n');await copy(t);msg('全記録をコピーしました。')};$('exportJson').onclick=()=>{let b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),recordCount:records.length,records},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='pokemon-verification-records-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);msg('JSONを書き出しました。')};$('deleteAll').onclick=()=>{if(records.length&&confirm('保存記録をすべて削除しますか？')){records=[];persist();render();msg('全記録を削除しました。')}};setData(load(FK,TEMPLATE_DEFAULTS));render()})();
</script></body></html>
