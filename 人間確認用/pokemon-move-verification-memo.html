<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケモン技 検証メモ</title>
<style>
:root{--bg:#0f172a;--panel:#172033;--line:#334155;--text:#e5eefc;--muted:#9fb0c7;--accent:#2563eb;--input:#0b1220;--ok:#15803d;--danger:#7f1d1d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;color:var(--text);background:linear-gradient(180deg,#0b1120,#111827);min-height:100vh}button,input,textarea{font:inherit}.app{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}.lead{margin:0;color:var(--muted);line-height:1.6}.badge{border:1px solid #3b82f6;background:#172554;color:#bfdbfe;border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px}.card{background:rgba(23,32,51,.96);border:1px solid rgba(148,163,184,.18);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.25)}.head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.head h2{margin:0;font-size:18px}.body{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#cbd5e1}input,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}input:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.14)}textarea{min-height:78px;resize:vertical}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{width:auto;border:1px solid var(--line);background:#111827;color:#cbd5e1;border-radius:10px;padding:9px 13px;cursor:pointer}.choice.active{background:linear-gradient(#3b82f6,#2563eb);border-color:#60a5fa;color:white}.actions,.footer-actions,.mini-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white}.success{background:var(--ok);color:white}.secondary{background:#263348;color:#e5eefc;border:1px solid #3b4d67}.danger{background:var(--danger);color:#fee2e2}.mini{border:1px solid #3b4d67;background:#1f2937;color:#e5e7eb;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}.preview{white-space:pre-wrap;background:#090f1b;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:360px;max-height:650px;overflow:auto;font:13px/1.65 ui-monospace,Consolas,monospace;color:#dbeafe}.status{min-height:22px;margin-top:10px;color:#86efac;font-size:13px}.saved-list{display:grid;gap:10px}.saved{border:1px solid var(--line);background:#101827;border-radius:12px;padding:12px}.saved-title{font-weight:800}.saved-meta{font-size:12px;color:var(--muted);margin-top:3px}.empty,.hint{color:var(--muted);font-size:13px}.hint{line-height:1.55;margin-top:8px}@media(max-width:860px){.layout{grid-template-columns:1fr}header{flex-direction:column}}@media(max-width:620px){.app{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions .btn{flex:1 1 42%}}
</style>
</head>
<body><main class="app">
<header><div><h1>ポケモン技 検証メモ</h1><p class="lead">項目を埋めるだけで、Codexへそのまま送れる形式に整形します。入力内容と保存記録はこの端末内に自動保存されます。</p></div><div class="badge">ローカル保存・単体HTML</div></header>
<section class="layout"><div>
<div class="card"><div class="head"><h2>検証内容を入力</h2><button class="mini" id="clearForm">入力欄をクリア</button></div><div class="body"><div class="grid">
<!-- memo-template:start -->
<div><label>ポケモン</label><input id="pokemon" placeholder="例: エースバーン"></div>
<div><label>検証対象</label><input id="move" placeholder="例: 特性「もうか」火種 防御補正・丸め順"></div>
<div><label>攻撃側レベル</label><input id="attackerLevel" inputmode="numeric" placeholder="例: 15"></div>
<div class="full"><label>攻撃側ステータス</label><textarea id="attackerStats" placeholder="例: 攻撃418 / 持ち物なし / メダルなし"></textarea></div>
<div><label>相手ポケモン</label><input id="targetPokemon" placeholder="例: ピカチュウ / エースバーン / ゲッコウガ"></div>
<div><label>相手レベル</label><input id="targetLevel" inputmode="numeric" placeholder="例: 15"></div>
<div><label>相手最大HP</label><input id="targetMaxHp" inputmode="numeric" placeholder="例: 6300"></div>
<div><label>相手防御</label><input id="targetDefense" inputmode="numeric" placeholder="例: 240"></div>
<div><label>命中直前の相手HP</label><input id="targetCurrentHp" inputmode="numeric" placeholder="例: 発火攻撃が当たる直前のHP"></div>
<div><label>持ち物</label><input id="heldItems" placeholder="例: なし"></div>
<div><label>メダル</label><input id="emblems" placeholder="例: なし"></div>
<div class="full"><label>本体急所</label><div class="choices" id="criticalChoices"><button class="choice" data-v="なし">なし</button><button class="choice" data-v="あり">あり</button><button class="choice" data-v="不明">不明</button><button class="choice active" data-v="なし / 不明">なし / 不明</button><button class="choice" data-v="混在">混在</button></div><input type="hidden" id="critical" value="なし / 不明"></div>
<div><label>発火前の火種数</label><input id="startingCinderStacks" inputmode="numeric" placeholder="例: 4 または 3"></div>
<div class="full"><label>発火させた攻撃</label><div class="choices" id="triggerActionChoices"><button class="choice active" data-v="通常攻撃">通常攻撃</button><button class="choice" data-v="強化通常攻撃">強化通常攻撃</button><button class="choice" data-v="技">技</button><button class="choice" data-v="その他">その他</button></div><input type="hidden" id="triggerAction" value="通常攻撃"></div>
<div><label>技名・攻撃名</label><input id="triggerMoveName" placeholder="例: 通常攻撃 / 強化通常攻撃 / ニトロチャージ"></div>
<div><label>攻撃本体ダメージ表示</label><input id="bodyDamageDisplay" placeholder="例: 298"></div>
<div><label>火種追加ダメージ表示</label><input id="flareDamageDisplay" placeholder="例: 726"></div>
<div><label>本体+火種後の相手HP</label><input id="hpAfterFlare" inputmode="numeric" placeholder="例: 最終HP。自然回復が入ったら補足へ"></div>
<div class="full"><label>自然回復らしきズレ</label><div class="choices" id="naturalRecoveryObservedChoices"><button class="choice" data-v="なし">なし</button><button class="choice" data-v="あり">あり</button><button class="choice active" data-v="不明">不明</button></div><input type="hidden" id="naturalRecoveryObserved" value="不明"></div>
<div><label>実測ダメージ 1回目</label><input id="measuredDamage1" placeholder="例: 本体298 / 火種726"></div>
<div><label>実測ダメージ 2回目</label><input id="measuredDamage2" placeholder="例: 同条件2回目"></div>
<div><label>実測ダメージ 3回目</label><input id="measuredDamage3" placeholder="例: 同条件3回目"></div>
<div><label>表示回数</label><input id="displayCount" inputmode="numeric" placeholder="例: 本体と火種で2回"></div>
<div class="full"><label>補足</label><textarea id="notes" placeholder="例: 相手を変えて火種追加ダメージを測る。自然回復が入った場合は+値を記録。"></textarea></div>
<!-- memo-template:end -->
</div><div class="actions"><button class="btn secondary" id="applyTemplate">&#12486;&#12531;&#12503;&#12524;&#12434;&#35501;&#12415;&#36796;&#12416;</button><button class="btn primary" id="copyCurrent">現在の内容をコピー</button><button class="btn success" id="saveRecord">記録を保存</button><button class="btn secondary" id="duplicateForm">共通条件を残して新規</button></div><div class="status" id="status"></div></div></div>
<div class="card" style="margin-top:18px"><div class="head"><h2>保存済み記録</h2><span class="badge" id="count">0件</span></div><div class="body"><div id="savedList" class="saved-list"></div><div class="footer-actions"><button class="btn primary" id="copyAll">全記録をCodex用にコピー</button><button class="btn secondary" id="exportJson">JSONを書き出す</button><button class="btn danger" id="deleteAll">全記録を削除</button></div></div></div>
</div><aside class="card"><div class="head"><h2>Codex送信用プレビュー</h2></div><div class="body"><div class="preview" id="preview"></div><p class="hint">空欄も項目名を残して出力します。Codex側で不足項目を判断しやすくするためです。</p></div></aside></section>
</main>
<script>
(()=>{const FK='pkmVerify.form.v3',RK='pkmVerify.records.v1';const defs=[["pokemon", "ポケモン"], ["move", "検証対象"], ["attackerLevel", "攻撃側レベル"], ["attackerStats", "攻撃側ステータス"], ["targetPokemon", "相手ポケモン"], ["targetLevel", "相手レベル"], ["targetMaxHp", "相手最大HP"], ["targetDefense", "相手防御"], ["targetCurrentHp", "命中直前の相手HP"], ["heldItems", "持ち物"], ["emblems", "メダル"], ["critical", "本体急所"], ["startingCinderStacks", "発火前の火種数"], ["triggerAction", "発火させた攻撃"], ["triggerMoveName", "技名・攻撃名"], ["bodyDamageDisplay", "攻撃本体ダメージ表示"], ["flareDamageDisplay", "火種追加ダメージ表示"], ["hpAfterFlare", "本体+火種後の相手HP"], ["naturalRecoveryObserved", "自然回復らしきズレ"], ["measuredDamage1", "実測ダメージ 1回目"], ["measuredDamage2", "実測ダメージ 2回目"], ["measuredDamage3", "実測ダメージ 3回目"], ["displayCount", "表示回数"], ["notes", "補足"]];const TEMPLATE_DEFAULTS={"pokemon": "エースバーン", "move": "特性「もうか」火種 防御補正・丸め順", "attackerLevel": "15", "attackerStats": "攻撃418 / 持ち物なし / メダルなし", "targetPokemon": "ピカチュウ", "targetLevel": "15", "targetMaxHp": "", "targetDefense": "", "targetCurrentHp": "", "heldItems": "なし", "emblems": "なし", "critical": "なし / 不明", "startingCinderStacks": "4", "triggerAction": "通常攻撃", "triggerMoveName": "通常攻撃", "bodyDamageDisplay": "", "flareDamageDisplay": "", "hpAfterFlare": "", "naturalRecoveryObserved": "不明", "measuredDamage1": "", "measuredDamage2": "", "measuredDamage3": "", "displayCount": "", "notes": "火種追加ダメージ726の丸め順と防御補正を切り分ける検証。相手ポケモンを変えて、最大HP・防御・火種追加ダメージを記録する。野生ポケモンは上限500が混ざるため使わない。最終HPが計算とずれる場合、最大HPの1%自然回復が入った可能性を確認する。"};const $=id=>document.getElementById(id);let records=load(RK,[]),editing=null;function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function migrate(o={}){if(o.measuredDamage&&!o.measuredDamage1)o={...o,measuredDamage1:o.measuredDamage};return o}function data(){let o={};defs.forEach(([id])=>o[id]=$(id).value.trim());return o}function setData(o={}){o=migrate(o);const src=Object.keys(o).length?o:TEMPLATE_DEFAULTS;defs.forEach(([id])=>$(id).value=src[id]??(id==='critical'?'??':''));syncCritical();update();saveForm()}function damageSummary(o){let values=[o.measuredDamage1,o.measuredDamage2,o.measuredDamage3].filter(Boolean);if(!values.length&&o.measuredDamage)values=[o.measuredDamage];return values.length?'実測 '+values.join(' / '):'実測未入力'}function format(o,n=null){o=migrate(o);return `${n?`【検証記録 ${n}】`:'【ポケモン技 検証記録】'}\n`+defs.map(([id,l])=>`${l}: ${o[id]||''}`).join('\n')}function update(){$('preview').textContent=format(data())}function saveForm(){localStorage.setItem(FK,JSON.stringify(data()))}function msg(t,e=false){$('status').textContent=t;$('status').style.color=e?'#fca5a5':'#86efac';clearTimeout(msg.t);msg.t=setTimeout(()=>$('status').textContent='',2400)}async function copy(t){try{await navigator.clipboard.writeText(t)}catch{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}function syncCritical(){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.v===$('critical').value))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function persist(){localStorage.setItem(RK,JSON.stringify(records))}function render(){$('count').textContent=records.length+'件';let box=$('savedList');box.innerHTML='';if(!records.length){box.innerHTML='<div class="empty">まだ記録はありません。</div>';return}records.slice().reverse().forEach((r,ri)=>{r=migrate(r);let i=records.length-1-ri,d=document.createElement('div');d.className='saved';d.innerHTML=`<div class="saved-title">${esc([r.pokemon,r.move].filter(Boolean).join(' / ')||'名称未入力')}</div><div class="saved-meta">${esc(damageSummary(r))}・${esc(r.savedAt||'')}</div><div class="mini-actions"><button class="mini" data-a="copy">コピー</button><button class="mini" data-a="edit">編集</button><button class="mini" data-a="dup">複製</button><button class="mini" data-a="del">削除</button></div>`;d.querySelector('[data-a=copy]').onclick=async()=>{await copy(format(r));msg('保存記録をコピーしました。')};d.querySelector('[data-a=edit]').onclick=()=>{editing=r.id;setData(r);scrollTo({top:0,behavior:'smooth'});msg('記録を読み込みました。保存すると上書きします。')};d.querySelector('[data-a=dup]').onclick=()=>{editing=null;setData({...r,measuredDamage:'',measuredDamage1:'',measuredDamage2:'',measuredDamage3:'',displayCount:'',notes:''});scrollTo({top:0,behavior:'smooth'});msg('条件を複製しました。')};d.querySelector('[data-a=del]').onclick=()=>{if(confirm('この記録を削除しますか？')){records.splice(i,1);persist();render();msg('削除しました。')}};box.appendChild(d)})}document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',()=>{update();saveForm()}));document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{$('critical').value=b.dataset.v;syncCritical();update();saveForm()});$('applyTemplate').onclick=()=>{editing=null;setData(TEMPLATE_DEFAULTS);msg('Template loaded.')};$('copyCurrent').onclick=async()=>{await copy(format(data()));msg('現在の内容をコピーしました。')};$('saveRecord').onclick=()=>{let o=data(),now=new Date().toLocaleString('ja-JP');if(editing){let i=records.findIndex(x=>x.id===editing);if(i>=0)records[i]={...records[i],...o,savedAt:now};editing=null;msg('記録を更新しました。')}else{records.push({...o,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),savedAt:now});msg('記録を保存しました。')}persist();render()};$('duplicateForm').onclick=()=>{let o=data();editing=null;setData({...o,move:'',measuredDamage:'',measuredDamage1:'',measuredDamage2:'',measuredDamage3:'',displayCount:'',notes:''});msg('共通条件を残して新規作成しました。')};$('clearForm').onclick=()=>{if(confirm('入力欄をすべてクリアしますか？')){editing=null;setData({});msg('入力欄をクリアしました。')}};$('copyAll').onclick=async()=>{if(!records.length)return msg('記録がありません。',true);let t=['以下はポケモン技のゲーム内検証記録です。','各記録を確認し、実測値との照合、仕様判定、未確認事項の整理を行ってください。','',...records.map((r,i)=>format(r,i+1))].join('\n\n');await copy(t);msg('全記録をコピーしました。')};$('exportJson').onclick=()=>{let b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),recordCount:records.length,records},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='pokemon-verification-records-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);msg('JSONを書き出しました。')};$('deleteAll').onclick=()=>{if(records.length&&confirm('保存記録をすべて削除しますか？')){records=[];persist();render();msg('全記録を削除しました。')}};setData(load(FK,TEMPLATE_DEFAULTS));render()})();
</script></body></html>
