<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エースバーン ゲーム内検証ワークベンチ</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#66717f;--line:#dfe5eb;--green:#15803d;--green-bg:#dcfce7;--yellow:#a16207;--yellow-bg:#fef3c7;--red:#b91c1c;--red-bg:#fee2e2;--gray:#475569;--gray-bg:#e2e8f0;--purple:#7e22ce;--purple-bg:#f3e8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 18px}.header-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:700}button:hover{border-color:#94a3b8}main{max-width:1180px;margin:18px auto;padding:0 14px 60px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}.summary-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.summary-card strong{font-size:22px;display:block}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px;margin-bottom:16px}.item{background:var(--card);border:1px solid var(--line);border-left:7px solid #94a3b8;border-radius:14px;margin:14px 0;overflow:hidden}.item.status-confirmed{border-left-color:var(--green)}.item.status-needs-more{border-left-color:var(--yellow)}.item.status-conflict{border-left-color:var(--red)}.item.status-not-tested{border-left-color:var(--gray)}.item.status-codex-ready{border-left-color:var(--purple)}.item-head{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.item h2{font-size:19px;margin:0 0 4px}.priority{font-size:12px;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800}.status-buttons{display:flex;gap:6px;flex-wrap:wrap}.status-btn{opacity:.58}.status-btn.active{opacity:1;box-shadow:0 0 0 3px rgba(37,99,235,.16);transform:translateY(-1px)}.status-btn[data-status="confirmed"].active{background:var(--green-bg);border-color:var(--green);color:var(--green)}.status-btn[data-status="needs-more"].active{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow)}.status-btn[data-status="conflict"].active{background:var(--red-bg);border-color:var(--red);color:var(--red)}.status-btn[data-status="not-tested"].active{background:var(--gray-bg);border-color:var(--gray);color:var(--gray)}.status-btn[data-status="codex-ready"].active{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}.item-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.test-row{grid-template-columns:1fr 1fr!important}}.box{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafbfc}.box h3{font-size:15px;margin:0 0 8px}ul{margin:6px 0 0;padding-left:20px}label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;color:var(--text);font:inherit}textarea{min-height:86px;resize:vertical}.test-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}.result-table{width:100%;border-collapse:collapse;margin-top:10px}.result-table th,.result-table td{border:1px solid var(--line);padding:7px;text-align:left;vertical-align:top}.result-table th{background:#f8fafc;font-size:12px}.small-btn{padding:5px 8px;font-size:12px}.codex-preview{white-space:pre-wrap;background:#111827;color:#f9fafb;border-radius:10px;padding:12px;min-height:80px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}footer{color:var(--muted);font-size:12px;margin-top:20px}
</style></head><body><header><div class="header-row"><div><h1>エースバーン ゲーム内検証ワークベンチ</h1><div class="sub">7件の検証待ち項目を記録し、Codexへ渡せるJSONと要約を作成</div></div><div class="toolbar"><button id="saveBtn">保存</button><button id="exportBtn">JSON書き出し</button><button id="copyBtn">Codex要約をコピー</button><button id="resetBtn">全消去</button></div></div></header><main><div class="notice"><strong>使い方：</strong>1項目ずつ練習場で確認し、条件・実測値・結論を記録してください。「Codex反映可能」は、結果を十分確認し、修正内容をCodexへ渡せる状態になったときだけ選びます。入力内容はこのブラウザに自動保存されます。</div><div class="summary"><div class="summary-card"><span>全項目</span><strong id="totalCount">7</strong></div><div class="summary-card"><span>確認済み</span><strong id="confirmedCount">0</strong></div><div class="summary-card"><span>追加検証</span><strong id="moreCount">0</strong></div><div class="summary-card"><span>Codex反映可能</span><strong id="readyCount">0</strong></div></div><div id="items"></div><section class="item"><div class="item-head"><div><h2>Codex向けまとめ</h2><div class="sub">各項目の状態・結論・修正指示を自動生成</div></div></div><div class="item-body"><div id="codexPreview" class="codex-preview"></div></div></section><footer>保存先：ブラウザのlocalStorage。JSONを書き出してプロジェクト内へ置けばCodexへ渡せます。</footer></main>
<script>const ITEMS=[{"id": "blaze-stack", "title": "Blaze / 火種（stackOrMark）", "priority": "最優先", "questions": ["火種5つ目を付けた攻撃本体と追加ダメージは、どちらが先に処理されるか", "5つを超える付与が発生した場合、余剰スタックは残るか", "追加ダメージ発動後、スタックは完全に0へ戻るか", "複数対象ごとに火種は独立して保持されるか", "火種の正確な保持・更新ルールはどうなっているか"], "suggested": ["火種4つの対象へ通常攻撃・強化通常攻撃・技をそれぞれ当て、表示ダメージを比較する", "2スタック付与攻撃で4→発動した場合、余剰1スタックが残るか確認する", "2体へ交互に攻撃し、対象ごとに火種数が独立するか確認する", "5秒付近で再付与し、残り時間が更新されるか確認する"]}, {"id": "blaze-wild-cap", "title": "Blaze / 野生ポケモン上限500", "priority": "高", "questions": ["500上限は防御計算前と防御計算後のどちらに適用されるか", "急所時にも同じ上限処理になるか", "500上限は最大HP参照部分だけに適用されるか"], "suggested": ["最大HPが異なる複数の野生ポケモンで火種追加ダメージを比較する", "攻撃力・レベルを変えず、最大HP参照部分だけが500で止まるか確認する", "可能なら防御値の異なる対象で実測する"]}, {"id": "attack-wild-cap", "title": "通常攻撃 / 野生ポケモン上限1000", "priority": "高", "questions": ["1000上限は防御計算前と防御計算後のどちらに適用されるか", "急所時にも1000で止まるか", "通常攻撃1000の適用段階はどこか"], "suggested": ["攻撃力を段階的に上げ、表示ダメージが1000で止まる条件を記録する", "急所あり・なしで比較する", "防御値が異なる野生ポケモンで比較する"]}, {"id": "boosted-wild-cap", "title": "強化通常攻撃 / 野生ポケモン上限1300", "priority": "高", "questions": ["1300上限は防御計算前と防御計算後のどちらに適用されるか", "急所時にも1300で止まるか", "強化通常攻撃1300の適用段階はどこか"], "suggested": ["攻撃力を段階的に上げ、表示ダメージが1300で止まる条件を記録する", "急所あり・なしで比較する", "通常攻撃上限1000の検証結果と並べて比較する"]}, {"id": "feint-heal", "title": "Feint+ / 回復（次の3回の通常攻撃）", "priority": "中", "questions": ["次の3回の通常攻撃効果に時間切れがあるか", "通常攻撃を空振りした場合、回数を消費するか"], "suggested": ["フェイント使用後、時間を空けてから通常攻撃し、回復するか確認する", "フェイント使用後に空振りしてから命中させ、残り回数を確認する", "通常攻撃・強化通常攻撃の両方で回復量を確認する"]}, {"id": "feint-crit-disabled", "title": "Feint+ / 急所不可（次の3回の通常攻撃）", "priority": "中", "questions": ["次の3回の通常攻撃効果に時間切れがあるか", "通常攻撃を空振りした場合、急所不可の回数を消費するか"], "suggested": ["急所率を高くした状態で、フェイント使用後の3回が本当に急所にならないか確認する", "空振り後の命中回数と急所可否を記録する", "時間経過後に急所不可が残るか確認する"]}, {"id": "unite-missing-hp", "title": "Blazing Bicycle Kick / 減少HP参照ダメージ", "priority": "最優先", "questions": ["本体ダメージ前の減少HPを参照するか", "本体ダメージ後の減少HPを参照するか", "丸め処理はどの段階で行われるか"], "suggested": ["同じ対象・同じステータスで、現在HPだけを変えて複数回実測する", "本体ダメージ前参照と本体ダメージ後参照の両方を計算し、実測値と比較する", "小数が発生する条件を作り、端数処理を確認する"]}];const STORAGE_KEY="cinderace-game-verification-workbench-v1";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function render(){const root=document.getElementById("items");root.innerHTML=ITEMS.map(item=>`<section class="item status-not-tested" data-id="${item.id}" data-status="not-tested"><div class="item-head"><div><h2>${esc(item.title)}</h2><span class="priority">${esc(item.priority)}</span></div><div class="status-buttons"><button class="status-btn" data-status="confirmed">確認済み</button><button class="status-btn" data-status="needs-more">追加検証</button><button class="status-btn" data-status="conflict">結果矛盾</button><button class="status-btn active" data-status="not-tested">未検証</button><button class="status-btn" data-status="codex-ready">Codex反映可能</button></div></div><div class="item-body"><div class="grid"><div class="box"><h3>確認すること</h3><ul>${item.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div><div class="box"><h3>検証手順の候補</h3><ul>${item.suggested.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div></div><div class="grid"><div><label>検証条件・準備</label><textarea data-field="setup" placeholder="例：レベル15、攻撃力○○、対象○○、火種4つから開始"></textarea></div><div><label>仮説・予想</label><textarea data-field="hypothesis" placeholder="例：本体ダメージ後に火種追加ダメージが発生する"></textarea></div></div><label>実測記録</label><table class="result-table"><thead><tr><th>試行</th><th>条件</th><th>実測値・観察</th><th>証拠</th><th></th></tr></thead><tbody data-table-body></tbody></table><button class="small-btn add-row-btn">試行を追加</button><div class="grid"><div><label>結論</label><textarea data-field="conclusion" placeholder="確認できた仕様を、断定できる範囲だけ記載"></textarea></div><div><label>Codexへの修正指示</label><textarea data-field="codexInstruction" placeholder="例：処理順を本体ダメージ→火種追加ダメージとして記録。未確認部分はneedsGameVerificationのまま残す"></textarea></div></div><div class="test-row"><div><label>信頼度</label><select data-field="confidence"><option value="">未設定</option><option>低</option><option>中</option><option>高</option></select></div><div><label>確認日</label><input type="date" data-field="date"></div><div><label>ゲームバージョン</label><input data-field="gameVersion" placeholder="例：2026-06-25時点"></div><div><label>確認者</label><input data-field="reviewer" value="井上 晴乃進"></div></div><label>補足・未解決点</label><textarea data-field="notes" placeholder="まだ確定できない条件、再検証が必要な点など"></textarea></div></section>`).join("");document.querySelectorAll('.item[data-id]').forEach(section=>{section.querySelectorAll('.status-btn').forEach(btn=>btn.addEventListener('click',()=>setStatus(section,btn.dataset.status)));section.querySelector('.add-row-btn').addEventListener('click',()=>addRow(section));section.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',save));addRow(section)});load()}
function addRow(section,row={condition:"",observation:"",evidence:""}){const tbody=section.querySelector('[data-table-body]');const tr=document.createElement('tr');tr.innerHTML=`<td>${tbody.children.length+1}</td><td><textarea data-col="condition" placeholder="条件">${esc(row.condition)}</textarea></td><td><textarea data-col="observation" placeholder="実測値・観察">${esc(row.observation)}</textarea></td><td><textarea data-col="evidence" placeholder="動画名・スクショ・時刻など">${esc(row.evidence)}</textarea></td><td><button class="small-btn remove-row-btn">削除</button></td>`;tr.querySelectorAll('textarea').forEach(el=>el.addEventListener('input',save));tr.querySelector('.remove-row-btn').addEventListener('click',()=>{tr.remove();renumber(section);save()});tbody.appendChild(tr);renumber(section)}function renumber(section){[...section.querySelectorAll('[data-table-body] tr')].forEach((tr,i)=>tr.children[0].textContent=i+1)}
function setStatus(section,status){section.className='item status-'+status;section.dataset.status=status;section.querySelectorAll('.status-btn').forEach(b=>b.classList.toggle('active',b.dataset.status===status));save()}
function collect(){const reviews={};document.querySelectorAll('.item[data-id]').forEach(section=>{const fields={};section.querySelectorAll('[data-field]').forEach(el=>fields[el.dataset.field]=el.value);const trials=[...section.querySelectorAll('[data-table-body] tr')].map(tr=>({condition:tr.querySelector('[data-col="condition"]').value,observation:tr.querySelector('[data-col="observation"]').value,evidence:tr.querySelector('[data-col="evidence"]').value})).filter(r=>r.condition||r.observation||r.evidence);reviews[section.dataset.id]={title:ITEMS.find(x=>x.id===section.dataset.id).title,status:section.dataset.status||'not-tested',...fields,trials}});return{schemaVersion:'cinderace-game-verification-v1',exportedAt:new Date().toISOString(),pokemon:'cinderace',reviews}}
function save(){const data=collect();localStorage.setItem(STORAGE_KEY,JSON.stringify(data));updateSummary(data);updateCodexPreview(data)}function load(){const raw=localStorage.getItem(STORAGE_KEY);if(!raw){save();return}try{const data=JSON.parse(raw);Object.entries(data.reviews||{}).forEach(([id,review])=>{const section=document.querySelector(`.item[data-id="${id}"]`);if(!section)return;setStatus(section,review.status||'not-tested');section.querySelectorAll('[data-field]').forEach(el=>{if(review[el.dataset.field]!=null)el.value=review[el.dataset.field]});const tbody=section.querySelector('[data-table-body]');tbody.innerHTML='';(review.trials?.length?review.trials:[{}]).forEach(r=>addRow(section,r))});updateSummary(data);updateCodexPreview(data)}catch(e){console.error(e);save()}}
function updateSummary(data=collect()){const vals=Object.values(data.reviews);document.getElementById('confirmedCount').textContent=vals.filter(x=>x.status==='confirmed').length;document.getElementById('moreCount').textContent=vals.filter(x=>x.status==='needs-more').length;document.getElementById('readyCount').textContent=vals.filter(x=>x.status==='codex-ready').length}
function buildCodexSummary(data=collect()){const lines=['# エースバーン ゲーム内検証結果',''];Object.values(data.reviews).forEach(r=>{lines.push(`## ${r.title}`);lines.push(`- 状態: ${r.status}`);if(r.date)lines.push(`- 確認日: ${r.date}`);if(r.gameVersion)lines.push(`- ゲームバージョン: ${r.gameVersion}`);if(r.confidence)lines.push(`- 信頼度: ${r.confidence}`);if(r.setup)lines.push(`- 検証条件: ${r.setup}`);if(r.hypothesis)lines.push(`- 仮説: ${r.hypothesis}`);if(r.conclusion)lines.push(`- 結論: ${r.conclusion}`);if(r.codexInstruction)lines.push(`- Codexへの修正指示: ${r.codexInstruction}`);if(r.notes)lines.push(`- 補足・未解決点: ${r.notes}`);if(r.trials?.length){lines.push('- 試行記録:');r.trials.forEach((t,i)=>lines.push(`  ${i+1}. 条件=${t.condition||'未記入'} / 実測=${t.observation||'未記入'} / 証拠=${t.evidence||'なし'}`))}lines.push('')});return lines.join('\n')}
function updateCodexPreview(data=collect()){document.getElementById('codexPreview').textContent=buildCodexSummary(data)}document.getElementById('saveBtn').addEventListener('click',()=>{save();alert('保存しました')});document.getElementById('exportBtn').addEventListener('click',()=>{const data=collect();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cinderace-game-verification-results.json';a.click();URL.revokeObjectURL(a.href)});document.getElementById('copyBtn').addEventListener('click',async()=>{await navigator.clipboard.writeText(buildCodexSummary());alert('Codex向け要約をコピーしました')});document.getElementById('resetBtn').addEventListener('click',()=>{if(!confirm('保存内容をすべて削除しますか？'))return;localStorage.removeItem(STORAGE_KEY);location.reload()});render();</script></body></html>
