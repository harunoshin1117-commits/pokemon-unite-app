const STORAGE_KEY='mechanics-v3-batch02-review';
let reviews=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
const statusLabels={unreviewed:'未確認',adopted:'採用',fix:'要修正',hold:'保留'};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined||v===''?'—':String(v);
function reviewKey(pid,sourceId,effectId){return `${pid}::${sourceId}::${effectId||'__source__'}`;}
function getReview(key){return reviews[key]||{status:'unreviewed',note:''};}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(reviews)); updateStats(); applyFilters();}
function buttons(key){const r=getReview(key);return `<div class="review-buttons">${Object.entries(statusLabels).map(([s,l])=>`<button class="review-btn ${r.status===s?'selected':''}" data-key="${esc(key)}" data-status="${s}">${l}</button>`).join('')}</div><textarea data-note-key="${esc(key)}" placeholder="確認メモ・修正点・保留理由">${esc(r.note)}</textarea>`}
function render(){
 const pf=document.getElementById('pokemonFilter'); DATA.forEach(p=>{const o=document.createElement('option');o.value=p.pokemonId;o.textContent=`${p.pokemonNameJa} (${p.pokemonName})`;pf.appendChild(o)});
 app.innerHTML=DATA.map(p=>{
  const missing=(p.missingSources||[]).length;
  return `<section class="pokemon" data-pokemon="${esc(p.pokemonId)}"><div class="pokemon-head"><div><h2>${esc(p.pokemonNameJa)} <span style="opacity:.7;font-size:14px">${esc(p.pokemonName)}</span></h2><div>${esc(p.damageType||'')} / ${esc(p.range?.role||'')} / ${esc(p.range?.range||'')}</div></div><div class="pokemon-meta">ソース ${p.summary.sourceCount||0}件<br>特殊効果 ${p.summary.specialEffectCount||0}件<br>未取得 ${missing}件</div></div>
  ${missing?`<div class="warning">未取得ソースがあります: ${esc(JSON.stringify(p.missingSources))}</div>`:''}
  ${p.sourceEntries.map(e=>sourceHtml(p,e)).join('')}</section>`
 }).join('');
 bind(); updateStats(); applyFilters();
}
function sourceHtml(p,e){const s=e.source||{}; const effects=e.specialEffects||[]; const sk=reviewKey(p.pokemonId,s.sourceId,null); const sr=getReview(sk);
 const search=[p.pokemonName,p.pokemonNameJa,s.name,s.originalDescription,s.translatedDescription,...effects.flatMap(x=>[x.effectType,x.summary,x.sourceEvidence,x.codexInterpretation])].join(' ').toLowerCase();
 return `<article class="source-card review-state-${sr.status}" data-source data-search="${esc(search)}" data-source-status="${sr.status}" data-pokemon="${esc(p.pokemonId)}"><div class="source-title"><div><h3>${esc(s.name)}${s.isPlus?' ＋':''}</h3><div class="path">${esc(s.sourceId)} / ${esc(s.jsonPath)}</div></div><div class="badges"><span class="badge">${esc(s.sourceType)}</span>${s.learnLevel?`<span class="badge">Lv.${esc(s.learnLevel)}</span>`:''}${s.upgradeLevel?`<span class="badge">Plus Lv.${esc(s.upgradeLevel)}</span>`:''}<span class="badge">特殊効果 ${effects.length}件</span></div></div>
 <details><summary>英語原文・機械要約</summary><div class="desc">${esc(s.originalDescription)}</div><div class="machine">${esc(s.translatedDescription||'機械要約なし')}</div></details>
 ${baseHtml(e.baseAction)}
 ${effects.length?effects.map(x=>effectHtml(p,s,x)).join(''):`<div class="zero">特殊効果0件。直接ダメージや単純移動のみとして抽出されています。ここも人間確認してください。</div>`}
 <div class="review"><b>この技・ソース全体の判定</b>${buttons(sk)}</div></article>`}
function baseHtml(b){if(!b)return'';const fs=b.damageFormula||[];return `<div class="base"><b>基本動作</b><div>直接ダメージ: ${b.hasDirectDamage?'あり':'なし'} / 移動: ${b.hasMovement?'あり':'なし'}${b.movementType?` (${esc(b.movementType)})`:''}</div>${fs.length?`<details><summary>ダメージ式 ${fs.length}件</summary>${fs.map(f=>`<div class="field"><b>${esc(f.label||f.id)}</b>ratio=${esc(fmt(f.ratio))} / type=${esc(fmt(f.damageType))} / level=${esc(fmt(f.levelScaling))} / base=${esc(fmt(f.base))}<br>${esc(f.trueDescription||'')}<br><small>${esc(f.notes||'')}</small></div>`).join('')}</details>`:''}</div>`}
function effectHtml(p,s,x){const k=reviewKey(p.pokemonId,s.sourceId,x.effectId);const r=getReview(k);return `<div class="effect review-state-${r.status}" data-effect-status="${r.status}"><div class="effect-top"><div><h4>${esc(x.summary||x.effectType)}</h4><span class="badge">${esc(x.effectType)}</span></div><div class="sub">${esc(x.effectId)}</div></div><div class="effect-grid">
<div class="field"><b>発動</b>${esc(fmt(x.trigger))}</div><div class="field"><b>対象</b>${esc(fmt(x.target))}</div><div class="field"><b>保持者</b>${esc(fmt(x.holder))}</div><div class="field"><b>持続</b>${esc(fmt(x.durationSeconds))}秒</div><div class="field"><b>CD</b>${esc(fmt(x.cooldownSeconds))}秒</div><div class="field"><b>battleState</b>${x.requiresBattleState?'必要':'不要'}</div><div class="field"><b>行動順</b>${x.requiresActionOrder?'必要':'不要'}</div><div class="field"><b>時間管理</b>${x.requiresTimeTracking?'必要':'不要'}</div></div>
<details><summary>根拠・Codex解釈・未確認点</summary><div class="desc"><b>原文根拠</b>
${esc(x.sourceEvidence||'')}</div><div class="machine"><b>Codex解釈</b>
${esc(x.codexInterpretation||'')}</div>${(x.unconfirmedPoints||[]).length?`<div class="warning"><b>未確認点</b><br>${x.unconfirmedPoints.map(esc).join('<br>')}</div>`:''}</details>
<div class="review"><b>この特殊効果の判定</b>${buttons(k)}</div></div>`}
function bind(){document.querySelectorAll('.review-btn').forEach(btn=>btn.onclick=()=>{const key=btn.dataset.key;reviews[key]={...getReview(key),status:btn.dataset.status};save();refreshReviewUI(key)});document.querySelectorAll('textarea[data-note-key]').forEach(t=>t.oninput=()=>{const k=t.dataset.noteKey;reviews[k]={...getReview(k),note:t.value};localStorage.setItem(STORAGE_KEY,JSON.stringify(reviews));})}
function refreshReviewUI(key){document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`).forEach(b=>b.classList.toggle('selected',b.dataset.status===getReview(key).status));const parts=key.split('::');const effect=parts[2]!=='__source__';const ta=document.querySelector(`textarea[data-note-key="${CSS.escape(key)}"]`);const box=ta?.closest(effect?'.effect':'.source-card');if(box){box.classList.remove('review-state-adopted','review-state-fix','review-state-hold','review-state-unreviewed');box.classList.add('review-state-'+getReview(key).status);if(!effect)box.dataset.sourceStatus=getReview(key).status;}}
function updateStats(){let counts={unreviewed:0,adopted:0,fix:0,hold:0};document.querySelectorAll('textarea[data-note-key]').forEach(t=>counts[getReview(t.dataset.noteKey).status]++);document.getElementById('stats').innerHTML=Object.entries(counts).map(([s,n])=>`<span class="pill">${statusLabels[s]}: ${n}</span>`).join('')}
function applyFilters(){const p=document.getElementById('pokemonFilter').value;const st=document.getElementById('statusFilter').value;const q=document.getElementById('search').value.trim().toLowerCase();let visible=0;document.querySelectorAll('[data-source]').forEach(el=>{const okP=p==='all'||el.dataset.pokemon===p;const okS=st==='all'||el.dataset.sourceStatus===st;const okQ=!q||el.dataset.search.includes(q);const show=okP&&okS&&okQ;el.classList.toggle('hidden',!show);if(show)visible++});document.querySelectorAll('.pokemon').forEach(sec=>sec.classList.toggle('hidden',!sec.querySelector('[data-source]:not(.hidden)')));if(!visible&&!document.querySelector('.empty'))app.insertAdjacentHTML('beforeend','<div class="empty">条件に一致する項目がありません。</div>');else document.querySelectorAll('.empty').forEach(x=>x.remove())}
document.getElementById('pokemonFilter').onchange=applyFilters;document.getElementById('statusFilter').onchange=applyFilters;document.getElementById('search').oninput=applyFilters;
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);
document.getElementById('exportBtn').onclick=()=>{const out={schemaVersion:'human-review-v3.0',exportedAt:new Date().toISOString(),batch:'batch-02',reviews};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='batch-02-human-review-v3-results.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('resetBtn').onclick=()=>{if(confirm('保存した判定とメモをすべて削除しますか？')){reviews={};localStorage.removeItem(STORAGE_KEY);location.reload()}};
render();
</script>
</body></html>
