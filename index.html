<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="pokemons" id="pokemons">
               
            
                <div class="battle-area">
                    <div class="pokemon" id="pokemon">

                        <div class="main-pokemon-title">
                            <div >
                                <div class="all-reset" id="all-reset">
                                    <p class="select-font">攻撃側のポケモン選択</p>
                                    <button id="all-reset-button" class="all-reset-button">オールリセット</button>
                                </div>
                                <label for="pokemon-select">名前</label>
                                <select name="" id="pokemon-select"></select>
                                <div class="pokemon-img" id="pokemon-img"></div>
                            </div>
                            <div id="held-item-select" class="held-items-select">
                                <p class="held-item-title">持ち物選択</p>
                                <div class="held-items">
                                    <div>
                                        <div class="held-item">✚</div>
                                        <p>名前</p>
                                    </div>
                                    <div>
                                        <div class="held-item">✚</div>
                                        <p>名前</p>
                                    </div>
                                    <div>
                                        <div class="held-item">✚</div>
                                        <p>名前</p>
                                    </div>
                                </div> 
                                <div class="held-items-stats">
                                    <p>ステータス合計</p>
                                </div>
                            </div>
                        </div>

                        <section class="build-storage" aria-labelledby="build-storage-title">
                            <p id="build-storage-title" class="build-storage-title">ビルド保存</p>
                            <div class="build-storage-row">
                                <label for="build-name">保存名</label>
                                <input id="build-name" type="text" maxlength="50">
                                <button id="save-build-button" type="button">保存</button>
                            </div>
                            <div class="build-storage-row">
                                <label for="saved-build-select">保存済みビルド</label>
                                <select id="saved-build-select"></select>
                                <button id="show-build-details-button" type="button">内容を見る</button>
                                <button id="load-build-button" type="button">読み込み</button>
                                <button id="delete-build-button" type="button">削除</button>
                            </div>
                            <p id="build-storage-message" class="build-storage-message" aria-live="polite"></p>
                        </section>

                        <div>
                            <h1 id="pokemontitle" class="title-pokemon-title">Pikachu</h1>
                        </div>
                        
                        <div class="pokemon-items" id="pokemon-items">
                            <div>
                                <label for="level">レベル</label>
                                <select name="" id="level"></select>
                            </div>
                            <div class="item-show">
                                <div class="stats-area">
                                    <button id="player-stats-toggle" class="stats-title stats-toggle" type="button">ステータス</button>
                                    <div class="stats-text" id="stats-text">
                    
                                    </div>
                                </div>
                                <div class="skills-area">
                                    <p class="skill-name">覚える技</p>
                    
                                        <div class="skill-wrapper">
                                            
                                            


                                            <div class="skill-one" id="skill-one">
                                                <p>技セット１</p>
                                                <ul class="skill-list">
                                                <li id="skill-first-one" class="color-change"></li>
                                                <li id="skill-second-one" class="color-change"></li>
                                                <li id="skill-second-two" class="color-change"></li>
                                                </ul>
                                            </div>
                                            <div class="skill-two" id="skill-two">
                                                <p>技セット２</p>
                                                <ul class="skill-list">
                                                <li id="skill-first-two" class="color-change"></li>
                                                <li id="skill-third-one" class="color-change"></li>
                                                <li id="skill-third-two" class="color-change"></li>
                                                </ul>
                                            </div>
                                            <div class="unite" id="unite">
                                                <p>ユナイト技</p>
                                                <ul class="skill-list">
                                                <li id="unite-move" class="color-change"></li>
                                                </ul>
                                            </div>
                    
                                        </div>
                                </div>
                                <div>
                                    <p class="result-tiile">選んだ技</p>
                                    <div id="pokemon-result" class="pokemon-result">
                                        
                                        <div id="normalAttack" class="normalAttack">
                                                <p class="result-p">通常攻撃</p>
                                                <label >
                                                    <input type="checkbox" id="critical-check">
                                                    急所
                                                </label>
                                                <label>
                                                    <input type="checkbox" id="critical-pattern-lock">
                                                    急所結果を固定
                                                </label>
                                                <label for="normalAttack-hit">Hit数</label>
                                                <select name="" id="normalAttack-hit"></select>
                                                <p id="normalAttack-damage">威力</p>
                                        </div>





                                        <div>
                                            <p class="result-p">技セット１</p>
                                            <p class="result-p-p" id="skill-first-result"></p>
                                            <label for="damage-hit-one">Hit数</label>
                                            <select name="" id="damage-hit-one" class="damage-hit"></select>
                                            <p id="skill-first-damage">威力</p>
                                        </div>
                                        <div>
                                            <p class="result-p">技セット２</p>
                                            <p class="result-p-p" id="skill-second-result"></p>
                                            <label for="damage-hit-two">Hit数</label>
                                            <select name="" id="damage-hit-two" class="damage-hit"></select>
                                            <p id="skill-second-damage">威力</p>
                                        </div>
                                        <div>
                                            <p class="result-p">ユナイト技</p>
                                            <p class="result-p-p" id="skill-third-result"></p>
                                            <label for="damage-hit-unite">Hit数</label>
                                            <select name="" id="damage-hit-unite" class="damage-hit"></select>
                                            <p id="skill-third-damage">威力</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="result-buttons">
                                    <button class="attack-action result-button">攻  撃</button>
                                </div>
                            </div>
                        </div>
                        
                    
                    </div>




                    <div id="enemy-pokemon" class="enemy-pokemon">
                        <div id="enemy-title" class="enemy-title">
                    
                            <p>攻撃受ける側のポケモン選択</p>
                            <label for="pokemon-select-two">名前</label>
                            <select name="" id="pokemon-select-two"></select>
                            <h1 id="enemy-name" class="enemy-name">Pikachu</h1>
                        </div>
                        <div>
                            <label for="enemy-level">レベル</label>
                            <select name="" id="enemy-level"></select>
                        </div>
                    
                        <div id="enemy-stats" class="enemy-stats">
                            <button id="enemy-stats-toggle" class="enemy-stats-title stats-toggle" type="button">相手のステータス</button>
                            <div id="enemy-stats-text"></div>
                        </div>
                        
                        <div id="detail-popup-overlay" class="detail-popup-overlay">
                            <div class="detail-popup">
                                <div class="detail-popup-title">
                                    <p>通常攻撃の詳細</p>
                                    <button id="close-detail-popup" class="close-detail-popup" type="button">閉じる</button>
                                </div>
                                <div id="hitDamage-result" class="hit-damage-result"></div>
                            </div>
                        </div>
                    </div>
                                
                            
                </div>

                <div class="damage-result" id="damage-result">
                    <div class="damage-result-header">
                        <p>計算結果</p>
                        <button class="result-popup result-button">詳細表示</button>
                    </div>
                    <div id="detail-damage-result" class="detail-damage-result">

                        <div class="result-breakdown-card">
                            <p>通常攻撃のダメージ</p>
                            <div class="damage-taken-normalAttack" id="damage-taken-normalAttack"></div>
                            <div class="remaining-hp-normalAttack" id="remaining-hp-normalAttack"> </div>
                            <div class="hp-ber">
                                <div id="hp-fill-normalAttack" class="hp-fill-normalAttack"></div>
                            </div>
                        </div>
                       <div class="result-breakdown-card">
                            <p>技セット１のダメージ</p>
                           <div class="damage-taken" id="damage-taken"></div>
                           <div class=" remaining-hp" id="remaining-hp"></div>
                           <div class="hp-ber">
                                <div id="hp-fill-one" class="hp-fill"></div>
                           </div>
                       </div>
                       <div class="result-breakdown-card">
                            <p>技セット２のダメージ</p>
                           <div id="damage-taken-plus" class="damage-taken-plus"></div>
                           <div id="remaining-hp-plus" class="remaining-hp-plus"></div>
                            <div class="hp-ber">
                                <div id="hp-fill-two" class="hp-fill"></div>
                           </div>
                       </div>
                       <div class="result-breakdown-card">
                            <p>ユナイト技のダメージ</p>
                            <div id="unite-taken" class="unite-taken"></div>
                            <div id="remaining-hp-unite" class="remaining-hp-unite"></div>
                            <div class="hp-ber">
                                <div id="hp-fill-unite" class="hp-fill"></div>
                           </div>
                            
                       </div>
                       <div class="total-damage-card">
                            <p>合計ダメージ</p>
                            <div id="taken-all" class="taken-all"></div>
                            <div id="remaining-hp-all" class="remaining-hp-all"></div>
                             <div class="hp-ber">
                                <div id="hp-fill-all" class="hp-fill"></div>
                           </div>
                       </div>
                       <button id="result-breakdown-toggle" class="result-breakdown-toggle" type="button">内訳を見る</button>
                    </div>
                </div>
        </div>

    </div>

    <div id="build-details-overlay" class="build-details-overlay">
        <div class="build-details-modal" role="dialog" aria-modal="true" aria-labelledby="build-details-title">
            <div class="build-details-title">
                <p id="build-details-title">保存ビルドの内容</p>
                <button id="close-build-details" type="button">閉じる</button>
            </div>
            <div id="build-details-content" class="build-details-content"></div>
        </div>
    </div>

    <div class="overlay">

        <div class="item-modal">

           <div class="item-modal-title">
               <p>持ち物一覧</p>
               <div id="close-modal" class="close-modal">戻る</div>
           </div>

           <div class="item-modal-list" id="item-modal-list">

                <button class="select-items" data-id="scopeLens">

                    <p>ピントレンズ</p>
                    <img src="./images/scope-lens.png" alt="スクリーンショット" class="image-held-items">

                </button>
                <button class="select-items" data-id="muscleBand">

                    <p>力のハチマキ</p>
                    <img src="./images/muscle-band.png" alt="スクリーンショット" class="image-held-items">
                </button>
                <button class="select-items" data-id="wiseGlasses">

                    <p>物知り眼鏡</p>
                    <img src="./images/wise-glasses.png" alt="" class="image-held-items">
                </button>
           </div>
        </div>

    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
